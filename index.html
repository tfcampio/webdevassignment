<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Productivity Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="javascript.js" defer></script>
</head>
<body>

  <header class="app-header">
    <h1>Dashboard Hub</h1>
    <button id="theme-toggle-btn" type="button">Toggle Dark Mode</button>
  </header>

  <main class="dashboard-grid">

    <section class="card profile-card">
      <h2>Welcome back, Student!</h2>
      <p>Status: Active Developer</p>
    </section>

    <section class="card form-card">
      <h2>Add New Task</h2>
      <form id="task-form">
        <label for="task-name">Task Name</label>
        <input type="text" id="task-name" name="taskName" placeholder="Enter task name">

        <label for="task-priority">Priority Level</label>
        <select id="task-priority" name="taskPriority">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>

        <button type="submit">Add Task</button>
        <p id="error-message" class="error-text"></p>
      </form>
    </section>

    <section class="card task-card">
      <h2>My Tasks</h2>
      <ul id="task-list"></ul>
    </section>

  </main>

</body>
</html>
